pack:
  description: "Generated by SopEmojis"
  output-file: "generated/sopemojis-pack.zip"
  pack-format: 6
  font-default-height: 10
  font-default-ascent: 8

database:
  enabled: false
  sync-from-config: false
  auto-refresh-seconds: 0
  table-prefix: 'sopemojis_'
  host: '127.0.0.1'
  port: 3306
  database: 'minecraft'
  username: ''
  password: ''
  pool-name: 'SopEmojis'
  maximum-pool-size: 10
  minimum-idle: 2
  connection-timeout: 30000
  idle-timeout: 600000
  max-lifetime: 1800000

chat:
  enabled: true

debug:
  sprite-rendering: false

messages:
  no-permission: "&cNo permission."
  reloaded: "&aSopEmojis reloaded."
  pack-generated: "&aResource pack generated: &f{file}"
  pack-generation-failed: "&cFailed to generate resource pack: &f{error}"
  list-header: "&6Available emojis: &f{items}"
  only-player: "&cPlayers only."
  unknown-subcommand: "&cUnknown subcommand."
  sprite-warning: "&eSPRITE emojis are ignored in 1.16.5 chat rendering."
